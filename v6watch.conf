# shellcheck shell=sh
# v6watch configuration, sourced by v6watch.sh.
# Every setting is optional: uncomment a line to change its default.
# The installer never overwrites this file.

# LAN interface that carries the delegated prefix
#LAN_IF=br0

# Hosts pinged from the delegated prefix; one reply from any of them is enough
#TARGETS="2606:4700:4700::1111 2001:4860:4860::8888"

# Pings per target and seconds to wait for a reply
#PING_COUNT=2
#PING_TIMEOUT=3

# Seconds to wait after a DHCPv6 renew and after a WAN restart before checking
#RENEW_WAIT=30
#RESTART_WAIT=90

# Consecutive failed checks before the WAN is restarted, so that a short glitch
# does not drop IPv4 too. The DHCPv6 renew is tried at every failed check.
# 1 restarts the WAN at the first failed check.
#FAIL_THRESHOLD=2

# Minimum seconds between two WAN restarts. While restarts do not bring the
# prefix back the wait doubles after each one, up to RESTART_MAX_INTERVAL.
#RESTART_MIN_INTERVAL=3600
#RESTART_MAX_INTERVAL=86400

# Restart the WAN also when the router's WAN address stops working too (a
# general IPv6 outage); 0 to restart only when the delegated prefix alone fails
#RESTART_ON_WAN_FAIL=1

# Time (HHMM) of the daily "prefix still works" log entry; empty to disable.
# It must match a minute on which the cron job runs.
#DAILY_CHECK=1200

# cru schedule; apply changes with: /jffs/addons/v6watch.d/v6watch.sh cron
#CRON_SCHEDULE="*/5 * * * *"

# Persistent log, trimmed to LOG_LINES lines, and last seen LAN address
#LOG_FILE=/jffs/addons/v6watch.d/v6watch.log
#LOG_LINES=1000
#STATE_FILE=/jffs/addons/v6watch.d/v6watch.prefix
