name: ShellCheck

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        run: |
          shellcheck --version
          shellcheck -s sh v6watch.sh install.sh uninstall.sh v6watch.conf
      - name: Check line endings
        run: |
          if grep -l $'\r' v6watch.sh install.sh uninstall.sh v6watch.conf; then
            echo "Files above have CRLF line endings" >&2
            exit 1
          fi
